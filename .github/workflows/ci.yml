name: CI

on:
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Qualidade, Tipagem e Isolamento Multi-Tenant
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: legaas_owner
          POSTGRES_PASSWORD: legaas_owner_dev_password
          POSTGRES_DB: legaas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_OWNER_URL: postgresql://legaas_owner:legaas_owner_dev_password@localhost:5432/legaas_test
      DATABASE_URL: postgresql://legaas_app:legaas_app_dev_password@localhost:5432/legaas_test
      BETTER_AUTH_SECRET: ci-secret-key-with-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: sa-east-1
      S3_BUCKET: legaas-documents
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Unit & Integration Tests (incl. RLS Coverage)
        run: pnpm test --if-present

      - name: Build
        run: pnpm build
